version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: gitstats_postgres
    environment:
      POSTGRES_USER: gitstats
      POSTGRES_PASSWORD: secretpassword
      POSTGRES_DB: gitstats
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - gitstats_network
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gitstats -d gitstats"]
      interval: 5s
      timeout: 5s
      retries: 5

  gitstats-local:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gitstats_local
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/gitstats
      SPRING_DATASOURCE_USERNAME: gitstats
      SPRING_DATASOURCE_PASSWORD: secretpassword
    ports:
      - "${GITSTATS_LOCAL_PORT:-8080}:8080"
    networks:
      - gitstats_network
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
    driver: local

networks:
  gitstats_network:
    driver: bridge
