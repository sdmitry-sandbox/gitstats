spring:
  application:
    name: gitstats
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/gitstats}
    username: ${SPRING_DATASOURCE_USERNAME:gitstats}
    password: ${SPRING_DATASOURCE_PASSWORD:secretpassword}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    enabled: true

server:
  port: ${SERVER_PORT:8080}

scheduled-tasks:
  threads: 15
  queue-capacity: 100

scheduled:
  tasks:
    polling:
      interval: 1000

project:
  sync:
    interval: 300000

gitlab:
  base-url: ${GITLAB_BASE_URL:https://gitlab.cldx.io}
  private-token: ${GITLAB_PRIVATE_TOKEN:${PRIVATE_TOKEN:}}

vaadin:
  launch-browser: false
